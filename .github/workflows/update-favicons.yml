name: Update favicon links

on:
  push:
    paths:
      - '.github/workflows/update-favicons.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-favicons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update favicon markup in all HTML files
        shell: python
        run: |
          from pathlib import Path
          import re

          favicon_block = '''<link rel="icon" type="image/png" sizes="120x120" href="/assets/ui/favicon-120.png">
          <link rel="icon" type="image/png" sizes="32x32" href="/assets/ui/favicon-32.png">
          <link rel="icon" type="image/png" sizes="16x16" href="/assets/ui/favicon-16.png">
          <link rel="shortcut icon" href="/assets/ui/favicon.ico">'''

          changed = 0
          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              original = text

              # Replace existing favicon link(s) that point to assets/ui/favicon*. Leave other link types alone.
              pattern = r'(?:\s*<link\s+[^>]*?(?:rel=["\'][^"\']*(?:icon|shortcut icon)[^"\']*["\'])[^>]*?href=["\'][^"\']*assets/ui/favicon[^"\']*["\'][^>]*>\s*)+'
              text, n = re.subn(pattern, '\n  ' + favicon_block + '\n  ', text, count=1, flags=re.I)

              if n == 0:
                  # Handle href-before-rel ordering.
                  pattern2 = r'(?:\s*<link\s+[^>]*?href=["\'][^"\']*assets/ui/favicon[^"\']*["\'][^>]*?(?:rel=["\'][^"\']*(?:icon|shortcut icon)[^"\']*["\'])[^>]*>\s*)+'
                  text, n = re.subn(pattern2, '\n  ' + favicon_block + '\n  ', text, count=1, flags=re.I)

              if n == 0 and '</head>' in text:
                  text = text.replace('</head>', '  ' + favicon_block + '\n</head>', 1)

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed += 1

          print(f'Updated {changed} HTML files')

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' '**/*.html'
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: activate responsive LOREVI favicons"
            git push origin main
          fi
# One-time migration: install the shared Metrika loader on every HTML page.
name: Install Metrika on all HTML pages

on:
  push:
    paths:
      - '.github/workflows/install-metrika-all-pages.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add Metrika loader to every HTML page
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          marker = '<script src="/js/metrika.js" defer></script>'
          changed = []
          for p in Path('.').rglob('*.html'):
              if '.git' in p.parts:
                  continue
              text = p.read_text(encoding='utf-8')
              if marker in text:
                  continue
              if '</body>' not in text:
                  continue
              text = text.replace('</body>', marker + '\n</body>', 1)
              p.write_text(text, encoding='utf-8')
              changed.append(str(p))
          print(f'Updated {len(changed)} HTML files')
          for p in changed:
              print(p)
          PY
      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' '**/*.html'
          git commit -m 'Install Yandex Metrica on all public HTML pages'
          git push origin main
